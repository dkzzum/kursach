services:
  # --- 1. SCRAPER SERVICE ---
  scraper_service:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: telegram_scraper
    volumes:
      - ../data:/data
      - ../data:/app/data
      - ../src:/app/src
      - ../jobs:/app/jobs
      - warehouse_data:/user/hive/warehouse
      - ../spark_events:/opt/spark/events
    networks:
      - data-network
    command: tail -f /dev/null

  # --- 2. HIVE METASTORE DB ---
  hive-metastore-db:
    image: postgres:13
    container_name: metastore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive_password
    volumes:
      - metastore_db_data:/var/lib/postgresql/data
    networks:
      - data-network

  # --- 3. HIVE METASTORE ---
  hive-metastore:
    build:
      context: ..
      dockerfile: docker/hive.Dockerfile
    container_name: hive_metastore
    restart: unless-stopped
    volumes:
      - warehouse_data:/user/hive/warehouse
    depends_on:
      - hive-metastore-db
    environment:
      - DB_DRIVER=postgres
      - SERVICE_NAME=metastore
      - SERVICE_OPTS=-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore_db:5432/metastore_db -Djavax.jdo.option.ConnectionUserName=hive -Djavax.jdo.option.ConnectionPassword=hive_password
    networks:
      - data-network

  # --- 4. SPARK MASTER ---
  spark-master:
    build:
      context: ..
      dockerfile: docker/spark.Dockerfile
    container_name: spark_master
    user: root
    environment:
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "9090:8080"
      - "7077:7077"
    volumes:
      - ../data:/data
      - ../jobs:/opt/application/jobs
      - warehouse_data:/user/hive/warehouse
      - ../spark_events:/opt/spark/events
    networks:
      - data-network
    # 👇 ВОТ ЭТОЙ СТРОКИ НЕ ХВАТАЛО:
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  # --- 5. SPARK WORKER ---
  spark-worker:
    build:
      context: ..
      dockerfile: docker/spark.Dockerfile
    container_name: spark_worker
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      # 👇 ДАЕМ БОЛЬШЕ МОЩНОСТИ
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8081:8081"
    volumes:
      - ../data:/data
      - ../jobs:/opt/application/jobs
      - warehouse_data:/user/hive/warehouse
      - ../spark_events:/opt/spark/events
    networks:
      - data-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  # --- 6. SPARK THRIFT SERVER (С ЗАДЕРЖКОЙ) ---
  spark-thrift-server:
    build:
      context: ..
      dockerfile: docker/spark.Dockerfile
    container_name: spark_thrift
    user: root
    depends_on:
      - spark-master
      - hive-metastore
    environment:
      - SPARK_PUBLIC_DNS=localhost
      - HIVE_METASTORE_URIS=thrift://hive-metastore:9083
    ports:
      - "10000:10000"
      - "4040:4040"
    volumes:
      - ../data:/data
      - ../jobs:/opt/application/jobs
      - warehouse_data:/user/hive/warehouse
    networks:
      - data-network
    # Ждем 30 секунд перед стартом, чтобы Hive успел проснуться
    command: >
      /bin/bash -c "
      echo '⏳ Ждем 30 сек пока проснется Hive Metastore...';
      sleep 30;
      echo '🚀 Запускаем Spark Thrift Server...';
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --class org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
      --name 'Thrift JDBC/ODBC Server'
      --conf spark.sql.warehouse.dir=/user/hive/warehouse
      --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
      --conf spark.hive.server2.thrift.port=10000
      --conf spark.hive.server2.thrift.bind.host=0.0.0.0
      --conf spark.driver.extraClassPath=/opt/spark/jars/postgresql-42.6.0.jar
      --conf spark.cores.max=1
      --conf spark.executor.memory=512m
      --executor-memory 512m
      "

  # --- 7. APACHE SUPERSET ---
  superset:
    build:
      context: ..
      dockerfile: docker/superset.Dockerfile
    container_name: superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "my-secret-key-change-me-in-prod"
    depends_on:
      - spark-thrift-server
    networks:
      - data-network

networks:
  data-network:
    driver: bridge

volumes:
  warehouse_data:
  metastore_db_data: