version: '3.8'

services:
  # --- 1. SCRAPER SERVICE (Сбор данных + Запуск скриптов) ---
  scraper_service:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: telegram_scraper
    volumes:
      # Data Land: общий доступ к данным
      - ../data:/data
      - ../data:/app/data
      # Код
      - ../src:/app/src
      - warehouse_data:/user/hive/warehouse
      - ../spark_events:/opt/spark/events
      - ../jobs:/app/jobs
      - warehouse_data:/user/hive/warehouse
    networks:
      - data-network
    # Бесконечный цикл, чтобы контейнер не падал
    command: tail -f /dev/null

  # --- 2. HIVE METASTORE DB (База данных) ---
  hive-metastore-db:
    image: postgres:13
    container_name: metastore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive_password
    volumes:
      - metastore_db_data:/var/lib/postgresql/data
    networks:
      - data-network

  # --- 3. HIVE METASTORE (Каталог таблиц) ---
  hive-metastore:
    build:
      context: ..
      dockerfile: docker/hive.Dockerfile
    container_name: hive_metastore
    restart: unless-stopped
    volumes:
      - warehouse_data:/user/hive/warehouse  # Чтобы видеть общий склад
      - ../data:/data                        # Чтобы видеть твои Parquet-файлы
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: "-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore_db:5432/metastore_db -Djavax.jdo.option.ConnectionUserName=hive -Djavax.jdo.option.ConnectionPassword=hive_password -Dhive.metastore.warehouse.dir=/user/hive/warehouse"
    ports:
      - "9083:9083"
    depends_on:
      - hive-metastore-db
    networks:
      - data-network

  # --- 4. SPARK MASTER (Главный узел) ---
    # --- 4. SPARK MASTER (Главный узел) ---
  spark-master:
    build:
      context: ..
      dockerfile: docker/spark.Dockerfile
    container_name: spark_master
    user: root
    environment:
      - SPARK_CONF_DIR=/opt/spark/conf
      - SPARK_PUBLIC_DNS=localhost
    ports:
      - "9090:8080"
      - "7077:7077"
    volumes:
      - ../data:/data
      - ../data:/opt/application/data
      - ../src:/opt/application/src
      - ../spark_events:/opt/spark/events
      - ../jobs:/opt/application/jobs
      - warehouse_data:/user/hive/warehouse
    working_dir: /opt/application
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - data-network

    # --- 5. SPARK WORKER (Рабочий узел) ---
  spark-worker:
    build:
      context: ..
      dockerfile: docker/spark.Dockerfile
    container_name: spark_worker
    user: root
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8081:8081"
    volumes:
      - ../data:/data
      - ../data:/opt/application/data
      - ../src:/opt/application/src
      - ../spark_events:/opt/spark/events
      - ../jobs:/opt/application/jobs
      - warehouse_data:/user/hive/warehouse
    working_dir: /opt/application
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - data-network

    # --- 6. SPARK THRIFT SERVER (SQL Интерфейс для Superset) ---
  spark-thrift-server:
    build:
      context: ..
      dockerfile: docker/spark.Dockerfile
    container_name: spark_thrift
    user: root
    depends_on:
      - spark-master
      - hive-metastore
    environment:
      - SPARK_PUBLIC_DNS=localhost
      # Указываем, где метастор, чтобы видеть таблицы
      - HIVE_METASTORE_URIS=thrift://hive-metastore:9083
    ports:
      - "10000:10000"  # JDBC порт
      - "4040:4040"    # UI конкретно этого драйвера
    volumes:
      - ../data:/data
      - ../jobs:/opt/application/jobs
      - warehouse_data:/user/hive/warehouse
    # Запускаем Thrift Server, подключенный к мастеру
    command: >
      /opt/spark/sbin/start-thriftserver.sh 
      --master spark://spark-master:7077 
      --hiveconf hive.server2.thrift.port=10000 
      --hiveconf hive.server2.thrift.bind.host=0.0.0.0
      --conf spark.sql.warehouse.dir=/user/hive/warehouse
      --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
    networks:
      - data-network

    # --- 7. APACHE SUPERSET (Визуализация) ---
  superset:
    build:
      context: ..
      dockerfile: docker/superset.Dockerfile
    container_name: superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      # Секретный ключ обязателен для запуска (любая строка)
      SUPERSET_SECRET_KEY: "my-secret-key-change-me-in-prod"
    depends_on:
      - spark-thrift-server
    networks:
      - data-network

networks:
  data-network:
    driver: bridge

volumes:
  metastore_db_data:
  warehouse_data: